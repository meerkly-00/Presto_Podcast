name = "presto-audio-proxy"
main = "audio-proxy.js"
compatibility_date = "2026-05-01"
workers_dev = false

# feed.xml n'est plus routé ici : il est publié comme asset statique Pages
# (tools/episode_pages.py le copie dans site/), donc son sondage par les apps
# podcast ne consomme plus le quota quotidien Workers.
routes = [
  { pattern = "prestopodcast.online/audio/*", zone_name = "prestopodcast.online" },
  { pattern = "www.prestopodcast.online/audio/*", zone_name = "prestopodcast.online" },
]

[triggers]
crons = [
  "0 12 * * *",    # 8h EDT    — thread du matin       (data/tweets/DATE.json)
  "0 16 * * *",    # 12h EDT   — poll de midi          (data/tweets/DATE-midi.json)
  "30 21 * * *",   # 17h30 EDT — contre-programme      (data/tweets/DATE-soir.json)
]
