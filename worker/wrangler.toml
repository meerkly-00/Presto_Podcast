name = "presto-audio-proxy"
main = "audio-proxy.js"
compatibility_date = "2026-05-01"
workers_dev = false

# feed.xml est routé ici et lu depuis GitHub (raw) : le flux reste à jour même
# si `wrangler pages deploy` échoue. Cache de 5 min côté Cloudflare, donc le
# sondage des apps podcast ne consomme quasi pas de quota Workers.
routes = [
  { pattern = "prestopodcast.online/feed.xml", zone_name = "prestopodcast.online" },
  { pattern = "www.prestopodcast.online/feed.xml", zone_name = "prestopodcast.online" },
  { pattern = "prestopodcast.online/audio/*", zone_name = "prestopodcast.online" },
  { pattern = "www.prestopodcast.online/audio/*", zone_name = "prestopodcast.online" },
]

# ⏸ VOLET X EN PAUSE (28 août 2026) : les trois crons de publication sur X sont
# retirés. Le code des posteurs reste en place ; pour réactiver, remettre les
# lignes commentées ci-dessous.
[triggers]
crons = [
  "0 8 * * *",     # 4h EDT    — déclenche briefing.yml (ponctuel)
  # "0 12 * * *",    # 8h EDT    — thread du matin       (data/tweets/DATE.json)
  # "0 16 * * *",    # 12h EDT   — poll de midi          (data/tweets/DATE-midi.json)
  # "30 21 * * *",   # 17h30 EDT — contre-programme      (data/tweets/DATE-soir.json)
]
