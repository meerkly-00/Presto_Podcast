name = "presto-audio-proxy"
main = "audio-proxy.js"
compatibility_date = "2026-05-01"
workers_dev = false

# La route feed.xml est déclarée ici parce qu'elle existe RÉELLEMENT côté
# Cloudflare : le plan « feed.xml servi par Pages » (bd0859e) n'a jamais été
# appliqué, son déploiement ayant échoué. Tant que la route existe, Pages ne
# voit jamais la requête. Pour basculer le feed sur Pages plus tard :
#   1. deploy-site.yml et vérifier https://presto.pages.dev/feed.xml (contourne
#      la route) ;  2. retirer la route ci-dessous + le handler dans
#   audio-proxy.js ;  3. déployer. Dans cet ordre, sans coupure.
routes = [
  { pattern = "prestopodcast.online/audio/*", zone_name = "prestopodcast.online" },
  { pattern = "www.prestopodcast.online/audio/*", zone_name = "prestopodcast.online" },
  { pattern = "www.prestopodcast.online/feed.xml", zone_name = "prestopodcast.online" },
]

[triggers]
crons = [
  # Deux crons UTC pour une seule heure locale : Cloudflare ne planifie qu'en
  # UTC, donc 6h à Montréal tombe à 10h UTC l'été (EDT) et à 11h UTC l'hiver
  # (EST). Le handler `scheduled` ignore celui qui n'est pas 6h heure locale —
  # sinon l'épisode avancerait à 5h au changement d'heure de novembre.
  "0 10 * * *",    # 6h à Montréal l'été   — déclenche briefing.yml (workflow_dispatch GitHub)
  "0 11 * * *",    # 6h à Montréal l'hiver — même cible, l'autre est alors ignoré
  "0 12 * * *",    # 8h EDT    — thread du matin       (data/tweets/DATE.json)
  "0 16 * * *",    # 12h EDT   — poll de midi          (data/tweets/DATE-midi.json)
  "30 21 * * *",   # 17h30 EDT — contre-programme      (data/tweets/DATE-soir.json)
]
