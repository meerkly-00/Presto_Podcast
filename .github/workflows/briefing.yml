name: Presto — briefing matinal

# Déclencheur principal : cron du Worker Cloudflare (worker/audio-proxy.js) à
# 6h00 heure du Québec — 10h UTC l'été (EDT), 11h UTC l'hiver (EST) — via
# workflow_dispatch (secret GITHUB_DISPATCH_TOKEN). Le `schedule` ci-dessous est
# un filet de sécurité : GitHub retarde les crons planifiés à la minute :00
# (parfois de plusieurs heures), donc on prend une minute hors-pointe. Le job
# `guard` évite de régénérer (et repayer) l'épisode si le déclencheur principal
# a déjà tourné, et empêche le filet de devancer 6h heure locale.
on:
  schedule:
    - cron: '17 10 * * *'  # 6h17 à Montréal l'été (EDT)   — filet de sécurité
    - cron: '17 11 * * *'  # 6h17 à Montréal l'hiver (EST) — l'autre est alors ignoré
  workflow_dispatch:       # bouton Run manuel dans GitHub / appel Worker Cloudflare
    inputs:
      force:
        description: "Régénérer même si le Presto du jour est déjà publié"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@v4

      - name: Presto du jour déjà publié ?
        id: check
        run: |
          DATE=$(date +%Y-%m-%d)
          HEURE=$(TZ=America/Toronto date +%-H)
          # Les deux crons `schedule` encadrent le changement d'heure : hors
          # saison, l'un des deux tombe à 5h17 heure du Québec. Le laisser
          # passer publierait l'épisode une heure trop tôt — soit exactement ce
          # que le passage à 6h corrige. Le déclencheur du Worker, lui, arrive
          # en workflow_dispatch et n'est jamais concerné.
          if [ "$EVENT" = "schedule" ] && [ "$HEURE" -lt 6 ]; then
            echo "::notice::Filet de sécurité déclenché à ${HEURE}h à Montréal — avant 6h, on saute."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "$FORCE" != "true" ] && [ -f "output/scripts/$DATE.xml" ]; then
            echo "::notice::Presto $DATE déjà publié — on saute (relancer avec force=true pour régénérer)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          FORCE: ${{ inputs.force }}
          EVENT: ${{ github.event_name }}

  presto:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt
      - name: Installer ffmpeg (binaire statique)
        run: |
          wget -q https://github.com/BtbN/ffmpeg-builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          tar -xf ffmpeg-master-latest-linux64-gpl.tar.xz
          sudo mv ffmpeg-master-latest-linux64-gpl/bin/ffmpeg /usr/local/bin/ffmpeg
          sudo mv ffmpeg-master-latest-linux64-gpl/bin/ffprobe /usr/local/bin/ffprobe
          ffmpeg -version | head -1

      - name: Générer le Presto du jour
        run: |
          DATE=$(date +%Y-%m-%d)
          export AUDIO_BASE_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$DATE"
          echo "DATE=$DATE" >> $GITHUB_ENV
          python run.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PODCAST_TITLE: Presto
          PODCAST_DESCRIPTION: "Briefing matinal francophone québécois : actualité, politique, économie, marchés et tech en environ 15 minutes. Toutes les archives restent disponibles."
          PODCAST_BASE_URL: https://www.prestopodcast.online
          PODCAST_ARTWORK_URL: https://www.prestopodcast.online/artwork-v2.jpg
          PODCAST_AUTHOR: Presto
          PODCAST_OWNER_EMAIL: prestopodcast@gmail.com
          EPISODE_TITLE_PREFIX: "Presto — édition du"
          SYSTEM_PROMPT_FILE: prompts/system_presto_v1.md
          CLAUDE_MODEL: claude-sonnet-5
          TTS_PROVIDER: openai
          TTS_MODEL: tts-1
          TTS_VOICE: onyx
          BRIEFING_DUREE_CIBLE: "15"
          BRIEFING_FENETRE_HEURES: "24"
          FEED_KEEP_DAYS: "3650"

      - name: Publier le MP3
        run: |
          if gh release view "$DATE" > /dev/null 2>&1; then
            gh release upload "$DATE" "output/audio/$DATE.mp3" --clobber
          else
            gh release create "$DATE" \
              --title "Presto — édition du $DATE" \
              --notes "Épisode automatisé Presto" \
              "output/audio/$DATE.mp3"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # NB: le tweet quotidien est désormais publié par tweet.yml à 8h EDT,
      # à partir du script committé ci-dessous (output/scripts/$DATE.xml).

      - name: Sauvegarder feed.xml, contexte et script
        run: |
          git config user.name "Presto Bot"
          git config user.email "presto-bot@noreply"
          git add feed.xml data/context.json "output/scripts/$DATE.xml"
          git diff --cached --quiet || git commit -m "presto: $DATE [skip ci]"
          git pull --rebase origin main
          git push

      # Non bloquant : l'épisode (MP3 + feed) est déjà publié à ce stade. Un
      # token Cloudflare invalide ne doit ni faire échouer le briefing, ni
      # empêcher tweet.yml d'enchaîner, ni ouvrir une issue « incident » par jour.
      - name: Pages épisodes + déploiement du site
        id: deploy
        continue-on-error: true
        run: |
          python tools/episode_pages.py --scripts output/scripts --site site --feed feed.xml
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN manquant : pages générées mais site non déployé"
            exit 0
          fi
          npx --yes wrangler@latest pages deploy site --project-name=presto --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "9792329eba865912f37a61f51c448412"

      - name: Alerte si le site n'est pas déployé (une seule issue)
        if: steps.deploy.outcome == 'failure'
        run: |
          echo "::error::Site non déployé (voir le step précédent — token Cloudflare probablement invalide). L'épisode est publié quand même."
          TITLE="⚠️ Site Presto non déployé — token Cloudflare à renouveler"
          if [ -z "$(gh issue list --state open --search "\"$TITLE\" in:title" --json number -q '.[0].number')" ]; then
            gh label create incident --color B60205 --description "Échec d'un workflow automatisé" 2>/dev/null || true
            gh issue create \
              --title "$TITLE" \
              --body "Le déploiement Cloudflare Pages échoue (Authentication error 10000 / Invalid access token 9109). L'épisode est publié (MP3 + feed), mais les pages du site ne sont plus à jour. Renouveler le secret CLOUDFLARE_API_TOKEN (Pages: Edit + Workers Scripts: Edit) puis lancer deploy-site.yml. Dernier run : $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              --label "incident" 2>/dev/null || true
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Alerte si échec
        if: failure()
        run: |
          gh label create incident --color B60205 --description "Échec d'un workflow automatisé" 2>/dev/null || true
          gh issue create \
            --title "⚠️ Briefing Presto échoué — $DATE" \
            --body "Le workflow briefing a échoué. Voir le run : $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --label "incident" 2>/dev/null || echo "::error::Briefing échoué pour $DATE (création d'issue impossible)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
