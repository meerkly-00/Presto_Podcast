name: Déployer le worker (manuel)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # Ne touche pas aux secrets déjà enregistrés côté Cloudflare (clés X) :
      # `wrangler deploy` ne publie que le code et les routes.
      - name: Déployer sur Cloudflare Workers
        run: npx --yes wrangler@latest deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "9792329eba865912f37a61f51c448412"
