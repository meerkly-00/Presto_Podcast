name: _smtp-test-oneshot
on: { workflow_dispatch: {} }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r requirements.txt
      - name: Envoi de test
        run: |
          python - << 'PYEOF'
          import sys
          sys.path.insert(0, "tools")
          import media_context_reply as m
          m.send_email(
              subject="Presto -- test technique (a ignorer)",
              html="<p style='font-family:sans-serif'>Ceci confirme que l'envoi SMTP du bot media-watch fonctionne. Aucune action requise.</p>",
          )
          PYEOF
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
