name: _email-preview-oneshot
on: { workflow_dispatch: {} }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r requirements.txt
      - name: Envoi d'un exemple reel
        run: |
          python - << 'PYEOF'
          import sys, types
          from datetime import datetime, timezone
          sys.path.insert(0, "tools")
          import media_context_reply as m

          tweet = types.SimpleNamespace(
              id=2086441458060669368,
              text="Gaza | Israël rejette le plan américain accepté par le Hamas",
              created_at=datetime.now(timezone.utc),
          )
          reply = ("Netanyahou précise qu'Israël rejette le plan tant que le Hamas "
                   "n'est pas 'véritablement' désarmé, et que l'armée ne se retirera "
                   "pas d'ici là. Selon BBC World.")
          html = m.build_email("LP_LaPresse", tweet, reply, 8,
                                "Omet la raison du rejet : désarmement du Hamas exigé par Netanyahou")
          m.send_email(subject="Presto — reply 8/10 sous @LP_LaPresse (exemple test)", html=html)
          PYEOF
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
