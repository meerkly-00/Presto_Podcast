name: Presto — contexte médias

on:
  schedule:
    - cron: '*/20 10-23 * * *'   # toutes les 20 min, 6h à 19h heure de Montréal (UTC-4)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "DRY_RUN (1 = ne poste pas, montre seulement)"
        default: "0"

concurrency:
  group: media-watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Repérer les contrastes factuels et envoyer les brouillons
        run: python tools/media_context_reply.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL: prestopodcast@gmail.com
          CLAUDE_MODEL: claude-sonnet-5
          MEDIA_WATCH_HANDLES: "JdeMontreal,LP_LaPresse,LeDevoir,RadioCanadaInfo"
          # Deux leviers de tuning : monter MIN_SCORE si le contenu déçoit,
          # baisser MAX_EMAILS_PER_DAY si le volume dérange.
          MIN_SCORE: "7"
          MAX_EMAILS_PER_DAY: "3"
          FRESH_MINUTES: "120"
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}

      - name: Sauvegarder l'état
        run: |
          git config user.name "Presto Bot"
          git config user.email "presto-bot@noreply"
          git add data/media_reply_state.json
          git diff --cached --quiet || git commit -m "media-watch: state [skip ci]"
          git pull --rebase origin main
          git push
