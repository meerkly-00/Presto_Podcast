name: Déployer le site (manuel)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Générer les pages épisodes
        run: python tools/episode_pages.py --scripts output/scripts --site site --feed feed.xml

      - name: Déployer sur Cloudflare Pages
        run: npx --yes wrangler@latest pages deploy site --project-name=presto --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "9792329eba865912f37a61f51c448412"
